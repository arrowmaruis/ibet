[project]
name = "ibet"
version = "0.1.0"
description = "Prevision de matchs de football : un modele dedie par evenement"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "tzdata>=2024.1 ; sys_platform == 'win32'",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["ibet"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ibet*"]
